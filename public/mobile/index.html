<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#214cd5" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="2;url=/mobile/login" />
    <title>Restaurant Mobile App</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #f2f5f9;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 20px;
        color: #0c1839;
        background: linear-gradient(180deg, #f2f5f9 0%, #e2e8f0 100%);
      }
      .loading-card {
        width: 100%;
        max-width: 400px;
        padding: 38px 24px 32px;
        text-align: center;
        background: #fff;
        border-radius: 24px;
        box-shadow: 0 12px 36px rgba(12, 24, 57, 0.08);
        animation: card-in 0.45s ease-out both;
      }
      .app-icon {
        width: 82px;
        height: 82px;
        display: block;
        margin: 0 auto 22px;
        border-radius: 22px;
        box-shadow: 0 8px 20px rgba(33, 76, 213, 0.2);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.3px;
      }
      p {
        margin: 0;
        color: #64748b;
        font-size: 14px;
      }
      .spinner {
        width: 34px;
        height: 34px;
        margin: 28px auto 16px;
        border: 3px solid #dbe5ff;
        border-top-color: #214cd5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .continue-link {
        color: #214cd5;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes card-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-card {
          animation: none;
        }
        .spinner {
          animation-duration: 1.6s;
        }
      }
    </style>
  </head>
  <body>
    <main class="loading-card" aria-live="polite">
      <img class="app-icon" src="../purchase-orders-192.png" alt="Restaurant" />
      <h1>Restaurant Mobile App</h1>
      <p>Preparing your mobile workspace…</p>
      <div class="spinner" role="status" aria-label="Loading"></div>
      <a class="continue-link" href="/mobile/login">Continue to login</a>
    </main>
    <script>
      window.setTimeout(function () {
        window.location.replace("/mobile/login");
      }, 1200);
    </script>
  </body>
</html>
